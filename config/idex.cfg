#####################################################################
# IDEX Configuration & Macros
#####################################################################

#####################################################################
# Centralized IDEX User Variables & Offsets
#####################################################################
[gcode_macro IDEX_VARIABLES]
# User-adjustable Toolhead 1 offsets (calibrated relative to T0)
variable_t1_offset_x: 0.0
variable_t1_offset_y: 0.0
variable_t1_offset_z: 0.0
# State tracking (internal)
variable_active_tool: 0
variable_idex_mode: "single"  # single, copy, mirror
gcode:
    # State storage container macro

#####################################################################
# Tool Selection Macros (T0 / T1)
#####################################################################
[gcode_macro T0]
description: Select Tool 0 (Primary carriage)
gcode:
    # Dynamically fetch parking position from hardware endstop configuration
    {% set park_t1 = printer.configfile.config["dual_carriage"]["position_endstop"]|float %}
    
    {% if printer.dual_carriage.active_carriage != "CARRIAGE_0" %}
        # Park active carriage 1 at its endstop
        G90
        SET_DUAL_CARRIAGE CARRIAGE=1
        G1 X{park_t1} F12000
        
        # Activate Carriage 0 & Extruder 0
        SET_DUAL_CARRIAGE CARRIAGE=0
        ACTIVATE_EXTRUDER EXTRUDER=extruder
        
        # Reset toolhead offset
        SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=1
        
        # Track active tool
        SET_GCODE_VARIABLE MACRO=IDEX_VARIABLES VARIABLE=active_tool VALUE=0
    {% endif %}

[gcode_macro T1]
description: Select Tool 1 (Secondary carriage)
gcode:
    # Dynamically fetch parking position from hardware endstop configuration
    {% set park_t0 = printer.configfile.config["stepper_x"]["position_endstop"]|float %}
    {% set vars = printer["gcode_macro IDEX_VARIABLES"] %}
    {% set off_x = vars.t1_offset_x %}
    {% set off_y = vars.t1_offset_y %}
    {% set off_z = vars.t1_offset_z %}
    
    {% if printer.dual_carriage.active_carriage != "CARRIAGE_1" %}
        # Park active carriage 0 at its endstop
        G90
        SET_DUAL_CARRIAGE CARRIAGE=0
        G1 X{park_t0} F12000
        
        # Activate Carriage 1 & Extruder 1
        SET_DUAL_CARRIAGE CARRIAGE=1
        ACTIVATE_EXTRUDER EXTRUDER=extruder1
        
        # Apply Tool 1 offset
        SET_GCODE_OFFSET X={off_x} Y={off_y} Z={off_z} MOVE=1
        
        # Track active tool
        SET_GCODE_VARIABLE MACRO=IDEX_VARIABLES VARIABLE=active_tool VALUE=1
    {% endif %}

#####################################################################
# IDEX Printing Modes
#####################################################################
[gcode_macro IDEX_SINGLE]
description: Configures printer for single toolhead printing mode
gcode:
    {% set target_tool = params.TOOL|default(0)|int %}
    SET_DUAL_CARRIAGE_MODE MODE=FULL_CONTROL
    SET_GCODE_VARIABLE MACRO=IDEX_VARIABLES VARIABLE=idex_mode VALUE='"single"'
    {% if target_tool == 0 %}
        T0
    {% else %}
        T1
    {% endif %}
    {action_respond_info("IDEX mode set to SINGLE (T" ~ target_tool ~ ")")}

[gcode_macro IDEX_COPY]
description: Configures printer for duplicated synchronous printing (COPY mode)
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    G90
    T0
    SET_DUAL_CARRIAGE CARRIAGE=1
    
    # Calculate offset dynamically from hardware travel bounds
    {% set x_min = printer.configfile.config["stepper_x"]["position_min"]|float %}
    {% set x_max = printer.configfile.config["dual_carriage"]["position_max"]|float %}
    {% set copy_offset = (x_max - x_min) / 2.0 %}
    
    G1 X{copy_offset} F12000
    SET_DUAL_CARRIAGE_MODE MODE=COPY
    SET_GCODE_VARIABLE MACRO=IDEX_VARIABLES VARIABLE=idex_mode VALUE='"copy"'
    {action_respond_info("IDEX mode set to COPY (Offset: " ~ copy_offset ~ "mm)")}

[gcode_macro IDEX_MIRROR]
description: Configures printer for mirrored synchronous printing (MIRROR mode)
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    G90
    T0
    SET_DUAL_CARRIAGE CARRIAGE=1
    
    # Position T1 near the maximum boundary
    {% set mirror_x = printer.configfile.config["dual_carriage"]["position_max"]|float - 10.0 %}
    G1 X{mirror_x} F12000
    SET_DUAL_CARRIAGE_MODE MODE=MIRROR
    SET_GCODE_VARIABLE MACRO=IDEX_VARIABLES VARIABLE=idex_mode VALUE='"mirror"'
    {action_respond_info("IDEX mode set to MIRROR")}

[gcode_macro IDEX_PARK]
description: Parks both toolheads safely at extreme ends
gcode:
    {% set park_t0 = printer.configfile.config["stepper_x"]["position_endstop"]|float %}
    {% set park_t1 = printer.configfile.config["dual_carriage"]["position_endstop"]|float %}
    SET_DUAL_CARRIAGE_MODE MODE=FULL_CONTROL
    G90
    SET_DUAL_CARRIAGE CARRIAGE=0
    G1 X{park_t0} F12000
    SET_DUAL_CARRIAGE CARRIAGE=1
    G1 X{park_t1} F12000

[gcode_macro PARK_TOOLHEAD]
description: Parks the currently active toolhead
gcode:
    {% set active = printer.dual_carriage.active_carriage %}
    G90
    {% if active == "CARRIAGE_0" %}
        {% set park_t0 = printer.configfile.config["stepper_x"]["position_endstop"]|float %}
        G1 X{park_t0} F12000
    {% else %}
        {% set park_t1 = printer.configfile.config["dual_carriage"]["position_endstop"]|float %}
        G1 X{park_t1} F12000
    {% endif %}

[gcode_macro REMAP_TOOLHEADS]
description: Swaps primary/secondary toolhead assignments
gcode:
    {action_respond_info("Remapping toolhead assignments")}

#####################################################################
# VAOC Light Controls
#####################################################################
[gcode_macro _LED_VAOC_ON]
description: Turn on VAOC offset light
gcode:
    SET_PIN PIN=offset_light VALUE=1.00

[gcode_macro _LED_VAOC_OFF]
description: Turn off VAOC offset light
gcode:
    SET_PIN PIN=offset_light VALUE=0.00

#####################################################################
# PAUSE / RESUME Routines
#####################################################################
[gcode_macro PAUSE]
description: Pauses print with IDEX carriage parking
rename_existing: PAUSE_BASE
gcode:
    PAUSE_BASE
    PARK_TOOLHEAD

[gcode_macro RESUME]
description: Resumes paused IDEX print
rename_existing: RESUME_BASE
gcode:
    RESUME_BASE
